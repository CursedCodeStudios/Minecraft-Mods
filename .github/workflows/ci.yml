name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read centralized versions
        id: versions
        run: |
          $config = Get-Content gradle.properties -Raw | ConvertFrom-StringData
          if ($config.java_version -notmatch '^\d+$') { throw 'Invalid java_version' }
          if ($config.suite_version -notmatch '^[0-9A-Za-z][0-9A-Za-z.+-]*$') { throw 'Invalid suite_version' }
          "java=$($config.java_version)" >> $env:GITHUB_OUTPUT
          "suite=$($config.suite_version)" >> $env:GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.java }}

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      - name: Build, test, and verify suite
        run: |
          if ($IsWindows) {
            & ./gradlew.bat build --no-daemon --stacktrace
          } else {
            & ./gradlew build --no-daemon --stacktrace
          }
          exit $LASTEXITCODE

      - name: Verify packaged suite modules
        run: |
          $config = Get-Content gradle.properties -Raw | ConvertFrom-StringData
          $manifest = Get-Content build/suite/suite-manifest.json -Raw | ConvertFrom-Json
          $expected = @('bedrockscout', 'fryutilities', 'seedscout', 'watcher') | Sort-Object
          $actual = @($manifest.mods.id) | Sort-Object
          if (Compare-Object $expected $actual) {
            throw "Suite manifest IDs differ. Expected: $($expected -join ', '); actual: $($actual -join ', ')"
          }
          foreach ($mod in $manifest.mods) {
            $targetMinecraft = $config.minecraft_version
            $targetApi = $config.fabric_api_version
            if ($mod.requires.minecraft -ne $targetMinecraft -or $mod.requires.'fabric-api' -ne ">=$targetApi") {
              throw "Incorrect Minecraft or Fabric API target in manifest: $($mod.id)"
            }
            $jar = Join-Path build/suite $mod.jar
            if (-not (Test-Path -LiteralPath $jar -PathType Leaf)) {
              throw "Missing packaged mod: $jar"
            }
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $jar))
            try {
              $reader = [System.IO.StreamReader]::new($archive.GetEntry('fabric.mod.json').Open())
              try { $metadata = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
              if ($metadata.depends.minecraft -ne $targetMinecraft -or $metadata.depends.'fabric-api' -ne ">=$targetApi") {
                throw "Incorrect Minecraft or Fabric API target inside JAR: $($mod.id)"
              }
            } finally { $archive.Dispose() }
          }
          $watcherJar = Join-Path build/suite (($manifest.mods | Where-Object id -eq 'watcher').jar)
          $watcherEntries = @(& jar tf $watcherJar)
          if ($LASTEXITCODE -ne 0 -or $watcherEntries -notcontains 'dev/frydae/watcher/Watcher.class') {
            throw 'Alt Affairs is missing its standalone entrypoint'
          }
          if ($watcherEntries -notcontains 'dev/frydae/accounts/LocalAccounts.class') {
            throw 'Alt Affairs is missing local account communication'
          }
          $seedJar = Join-Path build/suite (($manifest.mods | Where-Object id -eq 'seedscout').jar)
          $entries = @(& jar tf $seedJar)
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect $seedJar" }
          if ($entries -notcontains 'META-INF/jars/netherbedrockcracker-1.5.0.jar') {
            throw 'Seed Scout is missing its embedded Nether Bedrock Cracker engine'
          }
          $utilitiesJar = Join-Path build/suite (($manifest.mods | Where-Object id -eq 'fryutilities').jar)
          $utilitiesEntries = @(& jar tf $utilitiesJar)
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect $utilitiesJar" }
          $mergedEntrypoints = @(
            'dev/frydae/utilities/FryUtilities.class',
            'dev/frydae/accounts/LocalAccounts.class',
            'dev/frydae/utilities/alts/AltDashboard.class',
            'dev/frydae/utilities/alts/AltDashboardScreen.class',
            'dev/frydae/endcity/EndCityScout.class',
            'dev/frydae/slime/SlimeScout.class',
            'dev/frydae/monument/MonumentScout.class'
          )
          foreach ($entrypoint in $mergedEntrypoints) {
            if ($utilitiesEntries -notcontains $entrypoint) {
              throw "Fry Utilities is missing merged entrypoint: $entrypoint"
            }
          }

      - name: Upload suite artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minecraft-mod-suite-${{ steps.versions.outputs.suite }}-${{ matrix.os }}
          path: |
            build/suite/
            build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and diagnostic reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.os }}
          path: |
            mods/*/build/reports/
            mods/*/build/test-results/
            build/reports/
          if-no-files-found: ignore
          retention-days: 14
