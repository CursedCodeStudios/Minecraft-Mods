// Shared conventions for each independently installable mod.
apply plugin: 'net.fabricmc.fabric-loom'
// Optional per-module targets let one standalone mod upgrade independently.
def platformPrefix = project.name.replace('-', '_')
ext.targetMinecraftVersion = providers.gradleProperty("${platformPrefix}_minecraft_version").orElse(rootProject.minecraft_version.toString()).get()
ext.targetFabricApiVersion = providers.gradleProperty("${platformPrefix}_fabric_api_version").orElse(rootProject.fabric_api_version.toString()).get()
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    minecraft "com.mojang:minecraft:${targetMinecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${targetFabricApiVersion}"
    testImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.java_version)
    targetCompatibility = JavaVersion.toVersion(rootProject.java_version)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = rootProject.java_version.toInteger()
    options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar') { from(rootProject.file('LICENSE')) }
def metadataValues = [
    version: project.version.toString(), minecraft_version: targetMinecraftVersion,
    loader_version: rootProject.loader_version, java_version: rootProject.java_version,
    fabric_api_version: targetFabricApiVersion
]
tasks.named('processResources') {
    inputs.properties(metadataValues)
    filesMatching('fabric.mod.json') { expand metadataValues }
}
